<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8f6"><title>Stockly — 好きを、見つけやすく。</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#242725;background:#f8f8f6}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{max-width:1100px;margin:auto;padding:26px 20px 15px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:27px;font-weight:800;letter-spacing:-1.4px}.logo span{color:#648c77}.sub{font-size:12px;color:#777}.wrap{max-width:1100px;margin:auto;padding:0 20px 90px}.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:22px 0}.hero h1{font-size:clamp(23px,4vw,34px);letter-spacing:-1px;margin:0 0 7px}.hero p{margin:0;color:#7b807b;font-size:14px}.btn{background:#242e29;color:white;border:0;border-radius:13px;padding:12px 18px;font-weight:650}.btn.alt{background:#fff;color:#374139;border:1px solid #e2e6e0}.btn.small{padding:8px 11px;font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input{flex:1;min-width:190px}.field,.toolbar input,.toolbar select{border:1px solid #e3e6e1;background:white;border-radius:12px;padding:12px 13px;outline:none;min-width:0}.toolbar select{max-width:175px}.categories{display:flex;gap:9px;overflow:auto;padding:3px 0 13px}.chip{border:1px solid #e4e7e1;background:#fff;border-radius:100px;padding:10px 15px;white-space:nowrap;color:#4d554f}.chip.active{background:#dce9e0;border-color:#c8d9ce;color:#244936;font-weight:700}.section{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.section h2{font-size:17px;margin:0}.muted{font-size:12px;color:#8b918a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid #eaede7;border-radius:17px;overflow:hidden;min-width:0}.thumb{height:180px;background:#e8ede8;display:flex;align-items:center;justify-content:center;font-size:43px;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;top:10px;right:10px;border:0;background:#fffdf9ed;border-radius:100%;height:35px;width:35px;font-size:20px;color:#a5aaa4}.heart.on{color:#e17478}.content{padding:15px}.content h3{margin:0 0 7px;font-size:16px;overflow-wrap:anywhere}.meta{color:#879087;font-size:12px;margin-bottom:10px}.tags{display:flex;gap:5px;flex-wrap:wrap;min-height:25px}.tag{background:#f0f4f0;border-radius:6px;color:#5b7865;font-size:11px;padding:4px 6px}.memo{font-size:12px;color:#737a73;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}.actions{display:flex;gap:7px;margin-top:14px}.actions a,.actions button{border:1px solid #e6e9e5;background:#fff;border-radius:9px;padding:8px 11px;text-decoration:none;color:#39453d;font-size:12px}.empty{text-align:center;background:#fff;border:1px dashed #d6ddd5;border-radius:20px;padding:55px 20px;color:#727e74;grid-column:1/-1}.empty strong{display:block;font-size:19px;color:#35443a;margin:10px}.modal{position:fixed;inset:0;background:#17221b85;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.panel{background:#fff;border-radius:20px;padding:23px;width:min(100%,500px);max-height:90vh;overflow:auto}.panel h2{margin:0 0 17px}.form{display:grid;gap:11px}.form label{display:grid;gap:5px;font-size:12px;font-weight:700;color:#58635a}.form .field{width:100%}.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.footer{margin-top:35px;text-align:center;color:#949c93;font-size:12px}.utilities{display:flex;gap:7px;flex-wrap:wrap}.danger{color:#ae5050!important}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.thumb{height:145px}.content{padding:12px}.hero{align-items:flex-start}.hero h1{font-size:24px}.toolbar select{flex:1;max-width:none}.utilities{margin-top:12px}}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.thumb{height:125px}.actions{flex-wrap:wrap}.hero{flex-wrap:wrap}.hero .btn{width:100%}}
.auto-panel{padding:12px;background:#f4f7f4;border:1px solid #e3eae3;border-radius:12px}.auto-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.auto-panel p{margin:7px 0 0;font-size:12px;color:#68766b}.auto-panel #autoStatus{font-size:12px;color:#476b55}.auto-panel button:disabled{opacity:.55;cursor:wait}</style></head><body><header><div><div class="logo">stock<span>ly.</span></div><div class="sub">好きなものを、ひとつの場所に。</div></div><button class="btn alt small" id="addCategory">＋ カテゴリー</button></header><main class="wrap"><div class="hero"><div><h1>あなたの「好き」を整理しよう。</h1><p>SNSで見つけたレシピも、服も、行きたい場所も。</p></div><button class="btn" id="addItem">＋ 新しく保存</button></div><div class="categories" id="categories"></div><div class="toolbar"><input id="search" placeholder="⌕  タイトル・タグ・メモを検索"><select id="sort"><option value="new">保存日：新しい順</option><option value="old">保存日：古い順</option><option value="updated">更新日順</option><option value="fav">お気に入り順</option><option value="title">タイトル順</option></select><select id="source"><option value="">すべてのSNS</option><option>Instagram</option><option>TikTok</option><option>X</option><option>Pinterest</option><option>YouTube</option><option>その他</option></select></div><div class="section"><h2 id="heading">すべての保存</h2><span class="muted" id="count"></span></div><div class="grid" id="cards"></div><div class="footer"><div class="utilities"><button class="btn alt small" id="export">データをバックアップ</button><button class="btn alt small" id="import">バックアップを読み込む</button><input type="file" id="importFile" accept="application/json" hidden></div><p>このバージョンは端末のブラウザ内に保存します。ブラウザのデータを消すと失われるため、定期的にバックアップしてください。</p></div></main><div class="modal" id="modal"><div class="panel"><h2 id="modalTitle">投稿を保存</h2><form class="form" id="form"><label>タイトル *<input class="field" id="title" required maxlength="150" placeholder="例：明太クリームパスタ"></label><label>SNSのURL *<input class="field" id="url" type="url" required placeholder="https://..."></label><div class="auto-panel"><div class="auto-row"><button class="btn alt" type="button" id="autoFill">✨ URLから自動入力</button><span id="autoStatus" role="status" aria-live="polite"></span></div><p>取得できる投稿情報を入力します。SNSの制限で取得できない項目は手動で補えます。</p></div><label>カテゴリー<select class="field" id="category"></select></label><label>SNS<select class="field" id="network"><option>Instagram</option><option>TikTok</option><option>X</option><option>Pinterest</option><option>YouTube</option><option>その他</option></select></label><label>キーワード（カンマ区切り）<input class="field" id="tags" placeholder="パスタ, 簡単, 夜ご飯"></label><label>画像URL（任意）<input class="field" id="image" type="url" placeholder="https://.../photo.jpg"></label><label>メモ<textarea class="field" id="note" rows="3" placeholder="あとで試したいことなど"></textarea></label><label style="display:flex;align-items:center;gap:8px"><input id="favorite" type="checkbox">お気に入りにする</label><div class="row"><button class="btn alt" type="button" id="cancel">キャンセル</button><button class="btn" type="submit">保存する</button></div></form></div></div><script>
const KEY='stockly_web_v1';const defaultCats=[{id:'food',name:'料理',emoji:'🍳'},{id:'fashion',name:'ファッション',emoji:'👕'},{id:'travel',name:'旅行',emoji:'✈️'},{id:'interior',name:'インテリア',emoji:'🏠'}];let state;try{state=JSON.parse(localStorage.getItem(KEY))||{categories:defaultCats,items:[]}}catch{state={categories:defaultCats,items:[]}};if(!Array.isArray(state.categories)||!Array.isArray(state.items))state={categories:defaultCats,items:[]};let selected='all',editing=null;const $=id=>document.getElementById(id);const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{alert('保存できませんでした。ブラウザの保存容量を確認してください。');return false}};const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const validUrl=s=>{try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)}catch{return false}};const catBy=id=>state.categories.find(c=>c.id===id);function render(){const cats=$('categories');cats.innerHTML='';[{id:'all',name:'すべて',emoji:'◉'},{id:'favorites',name:'お気に入り',emoji:'♡'},...state.categories].forEach(c=>{const b=document.createElement('button');b.className='chip'+(selected===c.id?' active':'');b.textContent=c.emoji+' '+c.name;b.onclick=()=>{selected=c.id;render()};cats.append(b)});let q=$('search').value.toLocaleLowerCase().trim(),items=state.items.filter(x=>(selected==='all'||(selected==='favorites'?x.favorite:x.category===selected))&&(!$('source').value||x.network===$('source').value)&&(!q||[x.title,x.note,x.tags.join(' '),catBy(x.category)?.name].join(' ').toLocaleLowerCase().includes(q)));const sort=$('sort').value;items.sort((a,b)=>sort==='old'?a.created-b.created:sort==='updated'?b.updated-a.updated:sort==='fav'?Number(b.favorite)-Number(a.favorite)||b.created-a.created:sort==='title'?a.title.localeCompare(b.title,'ja'):b.created-a.created);$('heading').textContent=selected==='all'?'すべての保存':selected==='favorites'?'お気に入り':catBy(selected)?.name||'保存';$('count').textContent=items.length+' 件';const grid=$('cards');grid.innerHTML='';if(!items.length){grid.innerHTML='<div class="empty">📌<strong>まだ保存がありません</strong>「＋ 新しく保存」からSNSのURLを登録しよう。</div>';return}for(const x of items){const c=catBy(x.category),el=document.createElement('article');el.className='card';const img=validUrl(x.image||'')?`<img loading="lazy" src="${escapeHtml(x.image)}" alt="" onerror="this.remove()">`:'';el.innerHTML=`<div class="thumb">${escapeHtml(c?.emoji||'🔖')}${img}<button class="heart ${x.favorite?'on':''}" aria-label="お気に入り切り替え">${x.favorite?'♥':'♡'}</button></div><div class="content"><h3>${escapeHtml(x.title)}</h3><div class="meta">${escapeHtml(c?.name||'未分類')} · ${escapeHtml(x.network)} · ${new Date(x.created).toLocaleDateString('ja-JP')}</div><div class="tags">${x.tags.map(t=>`<span class="tag">#${escapeHtml(t)}</span>`).join('')}</div>${x.note?`<div class="memo">${escapeHtml(x.note)}</div>`:''}<div class="actions"><a href="${escapeHtml(x.url)}" target="_blank" rel="noopener noreferrer">元の投稿 ↗</a><button class="edit">編集</button><button class="delete danger">削除</button></div></div>`;el.querySelector('.heart').onclick=()=>{x.favorite=!x.favorite;x.updated=Date.now();persist();render()};el.querySelector('.edit').onclick=()=>openForm(x);el.querySelector('.delete').onclick=()=>{if(confirm('この保存を削除しますか？')){state.items=state.items.filter(i=>i.id!==x.id);persist();render()}};grid.append(el)}}function openForm(x){editing=x?.id||null;$('modalTitle').textContent=x?'保存内容を編集':'新しく保存';$('category').innerHTML='';state.categories.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.emoji+' '+c.name;$('category').append(o)});for(const id of ['title','url','tags','image','note'])$(id).value=x?(id==='tags'?x.tags.join(', '):x[id]||''):'';$('category').value=x?.category||state.categories[0]?.id;$('network').value=x?.network||'Instagram';$('favorite').checked=!!x?.favorite;$('modal').classList.add('open');$('title').focus()}function closeForm(){$('modal').classList.remove('open');editing=null}$('addItem').onclick=()=>openForm();$('cancel').onclick=closeForm;$('modal').onclick=e=>{if(e.target===$('modal'))closeForm()};$('form').onsubmit=e=>{e.preventDefault();const url=$('url').value.trim(),image=$('image').value.trim();if(!validUrl(url)||image&&!validUrl(image)){alert('URLはhttp://またはhttps://で始まる形式にしてください');return}const now=Date.now(),old=state.items.find(x=>x.id===editing);const item={id:old?.id||crypto.randomUUID(),title:$('title').value.trim(),url,category:$('category').value,network:$('network').value,tags:$('tags').value.split(',').map(s=>s.trim()).filter(Boolean),image,note:$('note').value.trim(),favorite:$('favorite').checked,created:old?.created||now,updated:now};if(!item.title)return;if(old)Object.assign(old,item);else state.items.push(item);persist();closeForm();render()};$('addCategory').onclick=()=>{const name=prompt('新しいカテゴリー名を入力してください');if(!name?.trim())return;const emoji=prompt('カテゴリーの絵文字（任意）','📁')||'📁';const id=crypto.randomUUID();state.categories.push({id,name:name.trim().slice(0,40),emoji:emoji.slice(0,4)});persist();selected=id;render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='stockly-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.categories)||!Array.isArray(data.items)||data.items.some(x=>!validUrl(x.url)||!Array.isArray(x.tags))){throw Error('invalid')}if(confirm('現在の保存データをバックアップの内容で置き換えますか？')){state=data;selected='all';persist();render()}}catch{alert('Stocklyの正しいバックアップファイルではありません')}e.target.value=''};['search','sort','source'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));render();

// Public oEmbed metadata is best-effort: browser CORS and provider permissions vary.
function identifySource(u){
 const h=u.hostname.toLowerCase().replace(/^www\./,'');
 if(h==='instagram.com')return 'Instagram';
 if(h==='tiktok.com'||h.endsWith('.tiktok.com'))return 'TikTok';
 if(h==='x.com'||h==='twitter.com'||h==='mobile.twitter.com')return 'X';
 if(h==='pinterest.com'||h.endsWith('.pinterest.com')||h==='pin.it')return 'Pinterest';
 if(h==='youtube.com'||h==='m.youtube.com'||h==='youtu.be')return 'YouTube';
 return 'その他';
}
function guessCategory(text){
 const t=text.toLowerCase();
 const rules=[
 ['food',/料理|レシピ|ご飯|パスタ|ランチ|ディナー|カフェ|recipe|food|cooking|pasta|meal|restaurant/],
 ['fashion',/ファッション|コーデ|洋服|服装|スニーカー|fashion|outfit|style|clothing|wear/],
 ['travel',/旅行|観光|旅館|ホテル|絶景|travel|trip|hotel|tourism|destination/],
 ['interior',/インテリア|家具|部屋|収納|interior|furniture|room|decor/]
 ];
 for(const [id,regex] of rules)if(regex.test(t)&&state.categories.some(c=>c.id===id))return id;
 return null;
}
function extractTags(text){
 const tags=[...text.matchAll(/#([\p{L}\p{N}_]+)/gu)].map(m=>m[1]);
 return [...new Set(tags)].slice(0,12);
}
let requestSeq=0;
async function autoFill(){
 const raw=$('url').value.trim();
 if(!validUrl(raw)){$('autoStatus').textContent='先に正しいURLを入力してください';return}
 const seq=++requestSeq;
 const u=new URL(raw);
 const network=identifySource(u);
 $('network').value=network;
 $('autoFill').disabled=true;
 $('autoStatus').textContent='投稿情報を取得中…';
 let info=null;
 try{
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),6500);
   try{
     const response=await fetch('https://noembed.com/embed?url='+encodeURIComponent(raw),{signal:controller.signal});
     if(response.ok){const result=await response.json();if(!result.error)info=result}
   }finally{clearTimeout(timer)}
 }catch(e){/* Cross-origin access or provider restrictions: manual fallback. */}
 if(seq!==requestSeq)return;
 let changed=0;
 const fill=(id,val)=>{if(val&&!$(id).value.trim()){$(id).value=val;changed++}};
 if(info){
   fill('title',typeof info.title==='string'?info.title.slice(0,150):'');
   const thumb=typeof info.thumbnail_url==='string'?info.thumbnail_url:'';
   if(validUrl(thumb))fill('image',thumb);
   const description=[info.title,info.author_name,info.description].filter(v=>typeof v==='string').join(' ');
   const tags=extractTags(description);
   if(tags.length)fill('tags',tags.join(', '));
   const category=guessCategory(description);
   if(category&&!editing)$('category').value=category;
 }
 if(!info){
   // Safe deterministic fallback: never invent the post's title or image.
   const hints=extractTags(decodeURIComponent(u.pathname.replace(/%(?![0-9A-Fa-f]{2})/g,'%25')));
   if(hints.length)fill('tags',hints.join(', '));
 }
 $('autoStatus').textContent=info&&changed?'取得できた情報を入力しました。確認して保存してください':info?'取得しました。未入力の項目は手動で追加できます':'この投稿の情報は自動取得できません。タイトルなどを入力してください';
 $('autoFill').disabled=false;
}
$('autoFill').addEventListener('click',autoFill);
$('url').addEventListener('input',()=>{
 $('autoStatus').textContent='';
 if(validUrl($('url').value.trim()))$('network').value=identifySource(new URL($('url').value.trim()));
});
$('url').addEventListener('paste',()=>{
 setTimeout(()=>{if(validUrl($('url').value.trim())&&!editing)autoFill()},80);
});

</script></body></html>
